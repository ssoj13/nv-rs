name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Crates that build without NVIDIA headers, on both OSes: formatting, the generator/loader/xtask
  # crates (nv-loader's Linux loader paths run here) and the Python stub checks.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p nv-loader -p nv-bindgen -p nv-bindgen-fixture -p xtask --all-targets -- -D warnings

      - name: Test Rust crates
        run: cargo test -p nv-loader -p nv-bindgen -p nv-bindgen-fixture -p xtask

      - name: Check Python stubs
        run: cargo run -p xtask -- py-stubs check

      - name: Python stub sync test
        run: python -m unittest python/nv-py/tests/test_stub_sync.py -v

  # Whole workspace. Hosted runners have no NVIDIA GPU, driver or licensed SDK, so:
  #  - the *-sys crates use their committed prebuilt bindings (NV_RS_USE_PREBUILT=1);
  #  - cuda-bindings still needs the CUDA Toolkit headers, installed by setup-cuda;
  #  - ngx-sys links the static NGX library, taken from the pinned public DLSS SDK;
  #  - every #[ignore] GPU test stays ignored, so nothing here proves driver behaviour.
  # Windows only: prebuilt bindings are committed for x86_64-pc-windows-msvc alone, and the
  # Linux-only cufile-sys / nccl-sys have none on any target. Add ubuntu-latest to the matrix once
  # `cargo xtask prebuilt --target x86_64-unknown-linux-gnu` output is committed for every sys crate.
  workspace:
    name: workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    env:
      NV_RS_USE_PREBUILT: "1"
      # Large generated sys crates (npp-sys) overflow rustc's default stack; same value as bootstrap.py.
      RUST_MIN_STACK: "67108864"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Setup CUDA Toolkit
        uses: ./.github/actions/setup-cuda

      - name: Fetch pinned OptiX and DLSS SDKs
        shell: bash
        run: |
          python bootstrap.py deps dl --only optix,ngx
          echo "OPTIX_ROOT=${GITHUB_WORKSPACE}/.sdk/optix" >> "$GITHUB_ENV"
          echo "NGX_SDK_ROOT=${GITHUB_WORKSPACE}/.sdk/ngx" >> "$GITHUB_ENV"

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (workspace)
        run: cargo test --workspace

  # Licenses, advisories, bans and git/registry sources from deny.toml.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Cargo deny
        run: cargo deny check
