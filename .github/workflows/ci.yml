name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Crates that build without NVIDIA headers, on both OSes: formatting, the generator/loader/xtask
  # crates (nv-loader's Linux loader paths run here) and the Python stub checks.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p nv-loader -p nv-bindgen -p nv-bindgen-fixture -p xtask --all-targets -- -D warnings

      - name: Test Rust crates
        run: cargo test -p nv-loader -p nv-bindgen -p nv-bindgen-fixture -p xtask

      - name: Check Python stubs
        run: cargo run -p xtask -- py-stubs check

      - name: Python stub sync test
        run: python -m unittest python/nv-py/tests/test_stub_sync.py -v

  # Whole workspace. Hosted runners have no NVIDIA GPU, driver or licensed SDK, so:
  #  - the *-sys crates use their committed prebuilt bindings (NV_RS_USE_PREBUILT=1);
  #  - cuda-bindings still needs the CUDA Toolkit headers, installed by setup-cuda;
  #  - ngx-sys links the static NGX library, taken from the pinned public DLSS SDK;
  #  - every #[ignore] GPU test stays ignored, so nothing here proves driver behaviour.
  # Windows only: prebuilt bindings are committed for x86_64-pc-windows-msvc alone, and the
  # Linux-only cufile-sys / nccl-sys have none on any target. Add ubuntu-latest to the matrix once
  # `cargo xtask prebuilt --target x86_64-unknown-linux-gnu` output is committed for every sys crate.
  workspace:
    name: workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    env:
      NV_RS_USE_PREBUILT: "1"
      # Large generated sys crates (npp-sys) overflow rustc's default stack; same value as bootstrap.py.
      RUST_MIN_STACK: "67108864"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Setup CUDA Toolkit
        uses: ./.github/actions/setup-cuda

      - name: Fetch pinned OptiX and DLSS SDKs
        shell: bash
        run: |
          python bootstrap.py deps dl --only optix,ngx
          echo "OPTIX_ROOT=${GITHUB_WORKSPACE}/.sdk/optix" >> "$GITHUB_ENV"
          echo "NGX_SDK_ROOT=${GITHUB_WORKSPACE}/.sdk/ngx" >> "$GITHUB_ENV"

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test (workspace)
        run: cargo test --workspace

  # `device/` is a separate cargo workspace (Rust -> PTX through cuda-oxide), so the jobs above never
  # compile it. Decision: BUILD-ONLY on a hosted runner. `cargo oxide build --arch sm_86` needs the
  # CUDA Toolkit and the OptiX headers (host crates `optix` / `cuda-core-ext` are path deps) but no
  # GPU or driver, so it runs on ubuntu-26.04 (the image setup-cuda targets). `cargo oxide run`
  # (the 15 GPU cases, wave_6_device.md D1) needs an RTX GPU and stays a manual check on hardware.
  # The cuda-oxide fork `ssoj13/cuda-rust_b` is private, so this job needs a repository secret
  # CUDA_RUST_B_TOKEN (fine-grained PAT, Contents: read on that repo). It is skipped for fork PRs,
  # which cannot read secrets; everywhere else a missing token fails the job instead of skipping it.
  device:
    name: device build (cargo oxide)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      CUDA_RUST_B_TOKEN: ${{ secrets.CUDA_RUST_B_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Require fork access token
        shell: bash
        run: |
          if [ -z "${CUDA_RUST_B_TOKEN}" ]; then
            echo "::error::secret CUDA_RUST_B_TOKEN is not set; device/ depends on the private ssoj13/cuda-rust_b fork"
            exit 1
          fi
          git config --global url."https://x-access-token:${CUDA_RUST_B_TOKEN}@github.com/ssoj13/cuda-rust_b".insteadOf "https://github.com/ssoj13/cuda-rust_b"

      # device/rust-toolchain.toml is the pin for this workspace (cuda-oxide refuses other
      # toolchains and needs rust-src, rustc-dev and llvm-tools); rustup installs exactly it,
      # components included, when run from device/.
      - name: Install device toolchain
        shell: bash
        working-directory: device
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: device

      - name: Install libclang for bindgen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config clang libclang-dev

      - name: Setup CUDA Toolkit
        uses: ./.github/actions/setup-cuda

      - name: Fetch pinned OptiX headers
        shell: bash
        run: |
          python bootstrap.py deps dl --only optix
          echo "OPTIX_ROOT=${GITHUB_WORKSPACE}/.sdk/optix" >> "$GITHUB_ENV"

      # Install cargo-oxide from the same fork revision device/Cargo.lock builds against, so the
      # driver and the cuda-device/cuda-core crates it compiles with cannot drift apart.
      - name: Install cargo-oxide (revision from device/Cargo.lock)
        shell: bash
        working-directory: device
        run: |
          rev="$(python -c "import re; print(re.search(r'cuda-rust_b\.git\?branch=main#([0-9a-f]{40})', open('Cargo.lock').read()).group(1))")"
          echo "cargo-oxide revision: ${rev}"
          cargo install --locked --git https://github.com/ssoj13/cuda-rust_b.git --rev "${rev}" cargo-oxide

      - name: Build device code (PTX)
        working-directory: device/optix-device-tests
        run: cargo oxide build --arch sm_86

      - name: Clippy (device workspace)
        working-directory: device
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Licenses, advisories, bans and git/registry sources from deny.toml.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Cargo deny
        run: cargo deny check
