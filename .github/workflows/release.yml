name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            archive: nv-demo-windows-x86_64.zip
          - os: ubuntu-26.04
            target: linux-x86_64
            archive: nv-demo-linux-x86_64.tgz

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install Linux GUI, Clang & Vulkan dev dependencies
        if: matrix.os == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            clang \
            libclang-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libvulkan-dev
          echo "VULKAN_SDK=/usr" >> "$GITHUB_ENV"

      - name: Setup Vulkan Headers (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # v1.4.369 (Vulkan-Headers); fetching by commit keeps the build reproducible.
          git init --quiet "${GITHUB_WORKSPACE}/vulkan-headers"
          git -C "${GITHUB_WORKSPACE}/vulkan-headers" fetch --quiet --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git d277a0a3cda9c682708c93279f0c72cd6b0ae3f3
          git -C "${GITHUB_WORKSPACE}/vulkan-headers" checkout --quiet FETCH_HEAD
          mkdir -p "${GITHUB_WORKSPACE}/vulkan-sdk"
          mv "${GITHUB_WORKSPACE}/vulkan-headers/include" "${GITHUB_WORKSPACE}/vulkan-sdk/Include"
          echo "VULKAN_SDK=${GITHUB_WORKSPACE}/vulkan-sdk" >> "$GITHUB_ENV"

      - name: Setup CUDA Toolkit
        uses: ./.github/actions/setup-cuda

      - name: Fetch pinned OptiX and DLSS SDKs
        shell: bash
        run: |
          python bootstrap.py deps dl --only optix,ngx
          echo "OPTIX_ROOT=${GITHUB_WORKSPACE}/.sdk/optix" >> "$GITHUB_ENV"
          echo "NGX_SDK_ROOT=${GITHUB_WORKSPACE}/.sdk/ngx" >> "$GITHUB_ENV"

      - name: Fetch Video Codec SDK headers (FFmpeg/nv-codec-headers)
        shell: bash
        run: |
          git init --quiet "${GITHUB_WORKSPACE}/nv-codec-headers"
          git -C "${GITHUB_WORKSPACE}/nv-codec-headers" fetch --quiet --depth 1 https://github.com/FFmpeg/nv-codec-headers.git f2053071ea93137255b6dcf42e9b4c9e0965a44e
          git -C "${GITHUB_WORKSPACE}/nv-codec-headers" checkout --quiet FETCH_HEAD
          mkdir -p "${GITHUB_WORKSPACE}/video-codec-sdk/Interface"
          cp "${GITHUB_WORKSPACE}/nv-codec-headers/include/ffnvcodec/nvEncodeAPI.h" "${GITHUB_WORKSPACE}/video-codec-sdk/Interface/nvEncodeAPI.h"
          echo "VIDEO_CODEC_SDK_ROOT=${GITHUB_WORKSPACE}/video-codec-sdk" >> "$GITHUB_ENV"

      - name: Build nv-demo (release)
        run: cargo build -p nv-demo --release

      - name: Stage portable Windows bundle
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/crates/nv-demo/shaders | Out-Null
          Copy-Item target/release/nv-demo.exe dist/
          cargo run -p xtask -- stage-dlls --out dist --libs cufft,nvjpeg,nvrtc,cupti,dlss
          foreach ($dir in @("$env:CUDA_PATH\bin\x64", "$env:CUDA_PATH\bin")) {
            if (Test-Path $dir) {
              Get-ChildItem -Path $dir -Filter "nvrtc-builtins64_*.dll" -ErrorAction SilentlyContinue |
                Copy-Item -Destination dist/ -Force
            }
          }
          Copy-Item crates/nv-demo/shaders/* dist/crates/nv-demo/shaders/
          Copy-Item README.md dist/
          Get-ChildItem -Path . -Filter "LICENSE*" | Copy-Item -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}" -Force

      - name: Stage portable Linux bundle
        if: matrix.os == 'ubuntu-26.04'
        shell: bash
        run: |
          mkdir -p dist/crates/nv-demo/shaders
          cp target/release/nv-demo dist/
          cargo run -p xtask -- stage-dlls --out dist --libs cufft,nvjpeg,nvrtc,cupti,dlss
          for dir in "${CUDA_PATH}/lib64" "${CUDA_PATH}/targets/x86_64-linux/lib"; do
            if [ -d "$dir" ]; then
              cp -L "$dir"/libnvrtc-builtins.so* dist/ 2>/dev/null || true
            fi
          done
          cp crates/nv-demo/shaders/* dist/crates/nv-demo/shaders/
          cp README.md LICENSE* dist/ 2>/dev/null || true
          cat << 'EOF' > dist/run-nv-demo.sh
          #!/usr/bin/env bash
          set -euo pipefail
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="${DIR}:${LD_LIBRARY_PATH:-}"
          exec "${DIR}/nv-demo" "$@"
          EOF
          chmod +x dist/nv-demo dist/run-nv-demo.sh
          tar -C dist -czf "${{ matrix.archive }}" .

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            nv-demo-windows-x86_64.zip
            nv-demo-linux-x86_64.tgz
          generate_release_notes: true
