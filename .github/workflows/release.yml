name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            archive: nv-demo-windows-x86_64.zip
          - os: ubuntu-26.04
            target: linux-x86_64
            archive: nv-demo-linux-x86_64.tgz

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI, Clang & Vulkan dev dependencies
        if: matrix.os == 'ubuntu-26.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            clang \
            libclang-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libvulkan-dev
          echo "VULKAN_SDK=/usr" >> "$GITHUB_ENV"

      - name: Setup Vulkan Headers (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git "${GITHUB_WORKSPACE}/vulkan-headers"
          mkdir -p "${GITHUB_WORKSPACE}/vulkan-sdk"
          mv "${GITHUB_WORKSPACE}/vulkan-headers/include" "${GITHUB_WORKSPACE}/vulkan-sdk/Include"
          echo "VULKAN_SDK=${GITHUB_WORKSPACE}/vulkan-sdk" >> "$GITHUB_ENV"

      - name: Setup CUDA Toolkit 13.3 (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\cuda_13.3.1_windows_network.exe"
          Invoke-WebRequest -UseBasicParsing -Uri "https://developer.download.nvidia.com/compute/cuda/13.3.1/network_installers/cuda_13.3.1_windows_network.exe" -OutFile $installer
          $proc = Start-Process -FilePath $installer -ArgumentList @(
            "-s",
            "nvcc_13.3",
            "crt_13.3",
            "cudart_13.3",
            "curand_13.3",
            "curand_dev_13.3",
            "nvrtc_13.3",
            "nvrtc_dev_13.3",
            "cufft_13.3",
            "cufft_dev_13.3",
            "nvjpeg_13.3",
            "nvjpeg_dev_13.3",
            "cupti_13.3",
            "nvml_dev_13.3"
          ) -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "CUDA 13.3.1 installer failed with exit code $($proc.ExitCode)"
          }
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.3"
          if (-not (Test-Path "$cudaPath\bin\nvcc.exe")) {
            throw "CUDA 13.3 installation missing nvcc.exe at $cudaPath\bin\nvcc.exe"
          }
          "CUDA_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDA_HOME=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDA_TOOLKIT_PATH=$cudaPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$cudaPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$cudaPath\bin\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup CUDA Toolkit 13.3 (Linux)
        if: matrix.os == 'ubuntu-26.04'
        shell: bash
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2604/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-13-3 \
            cuda-cudart-dev-13-3 \
            cuda-driver-dev-13-3 \
            libcurand-13-3 \
            libcurand-dev-13-3 \
            cuda-nvrtc-13-3 \
            cuda-nvrtc-dev-13-3 \
            libcufft-13-3 \
            libcufft-dev-13-3 \
            libnvjpeg-13-3 \
            libnvjpeg-dev-13-3 \
            cuda-cupti-13-3 \
            cuda-cupti-dev-13-3 \
            cuda-nvml-dev-13-3 \
            cuda-tileiras-13-3
          echo "CUDA_PATH=/usr/local/cuda-13.3" >> "$GITHUB_ENV"
          echo "CUDA_HOME=/usr/local/cuda-13.3" >> "$GITHUB_ENV"
          echo "CUDA_TOOLKIT_PATH=/usr/local/cuda-13.3" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-13.3/bin" >> "$GITHUB_PATH"

      - name: Fetch OptiX SDK headers (NVIDIA/optix-dev)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/NVIDIA/optix-dev.git "${GITHUB_WORKSPACE}/optix-dev"
          echo "OPTIX_ROOT=${GITHUB_WORKSPACE}/optix-dev" >> "$GITHUB_ENV"

      - name: Fetch NVIDIA DLSS SDK (NVIDIA/DLSS)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/NVIDIA/DLSS.git "${GITHUB_WORKSPACE}/dlss-sdk"
          echo "NGX_SDK_ROOT=${GITHUB_WORKSPACE}/dlss-sdk" >> "$GITHUB_ENV"

      - name: Fetch Video Codec SDK headers (FFmpeg/nv-codec-headers)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/FFmpeg/nv-codec-headers.git "${GITHUB_WORKSPACE}/nv-codec-headers"
          mkdir -p "${GITHUB_WORKSPACE}/video-codec-sdk/Interface"
          cp "${GITHUB_WORKSPACE}/nv-codec-headers/include/ffnvcodec/nvEncodeAPI.h" "${GITHUB_WORKSPACE}/video-codec-sdk/Interface/nvEncodeAPI.h"
          echo "VIDEO_CODEC_SDK_ROOT=${GITHUB_WORKSPACE}/video-codec-sdk" >> "$GITHUB_ENV"

      - name: Build nv-demo (release)
        run: cargo build -p nv-demo --release

      - name: Stage portable Windows bundle
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/crates/nv-demo/shaders | Out-Null
          Copy-Item target/release/nv-demo.exe dist/
          cargo run -p xtask -- stage-dlls --out dist --libs cufft,nvjpeg,nvrtc,cupti
          foreach ($dir in @("$env:CUDA_PATH\bin\x64", "$env:CUDA_PATH\bin")) {
            if (Test-Path $dir) {
              Get-ChildItem -Path $dir -Filter "nvrtc-builtins64_*.dll" -ErrorAction SilentlyContinue |
                Copy-Item -Destination dist/ -Force
            }
          }
          $dlssDll = Join-Path $env:NGX_SDK_ROOT "lib/Windows_x86_64/rel/nvngx_dlss.dll"
          if (Test-Path $dlssDll) {
            Copy-Item $dlssDll -Destination dist/ -Force
          }
          Copy-Item crates/nv-demo/shaders/* dist/crates/nv-demo/shaders/
          Copy-Item README.md dist/
          Get-ChildItem -Path . -Filter "LICENSE*" | Copy-Item -Destination dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive }}" -Force

      - name: Stage portable Linux bundle
        if: matrix.os == 'ubuntu-26.04'
        shell: bash
        run: |
          mkdir -p dist/crates/nv-demo/shaders
          cp target/release/nv-demo dist/
          cargo run -p xtask -- stage-dlls --out dist --libs cufft,nvjpeg,nvrtc,cupti
          for dir in "${CUDA_PATH}/lib64" "${CUDA_PATH}/targets/x86_64-linux/lib"; do
            if [ -d "$dir" ]; then
              cp -L "$dir"/libnvrtc-builtins.so* dist/ 2>/dev/null || true
            fi
          done
          if [ -d "${NGX_SDK_ROOT}/lib/Linux_x86_64/rel" ]; then
            cp -L "${NGX_SDK_ROOT}/lib/Linux_x86_64/rel"/libnvidia-ngx-dlss.so* dist/ 2>/dev/null || true
          fi
          cp crates/nv-demo/shaders/* dist/crates/nv-demo/shaders/
          cp README.md LICENSE* dist/ 2>/dev/null || true
          cat << 'EOF' > dist/run-nv-demo.sh
          #!/usr/bin/env bash
          set -euo pipefail
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="${DIR}:${LD_LIBRARY_PATH:-}"
          exec "${DIR}/nv-demo" "$@"
          EOF
          chmod +x dist/nv-demo dist/run-nv-demo.sh
          tar -C dist -czf "${{ matrix.archive }}" .

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            nv-demo-windows-x86_64.zip
            nv-demo-linux-x86_64.tgz
          generate_release_notes: true
