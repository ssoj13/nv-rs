[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Spikes are throwaway proofs with their own toolchains and lockfiles; `device` is the cuda-oxide
# device-code workspace (its own toolchain).
exclude = ["spikes", "device", "python"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Alex Khalyavin <joss13@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/ssoj13/nv-rs"
publish = false

[workspace.dependencies]
nv-loader = { path = "crates/nv-loader" }
nv-bindgen = { path = "crates/nv-bindgen" }
cuda-core-ext = { path = "crates/cuda-core-ext" }
appbus = { package = "appbus-rs", git = "ssh://git@github.com/ssoj13/appbus-rs.git", branch = "main", default-features = false, features = ["bus"] }
camera = { git = "ssh://git@github.com/ssoj13/camera-rs.git", branch = "main", features = ["egui", "serde"] }
csg-core = { git = "ssh://git@github.com/ssoj13/csg-rs.git", branch = "main" }
csg-actors = { git = "ssh://git@github.com/ssoj13/csg-rs.git", branch = "main" }
csg-scene = { git = "ssh://git@github.com/ssoj13/csg-rs.git", branch = "main" }
csg-device = { git = "ssh://git@github.com/ssoj13/csg-rs.git", branch = "main" }
csg-scenes = { git = "ssh://git@github.com/ssoj13/csg-rs.git", branch = "main" }
exr-core = { git = "ssh://git@github.com/ssoj13/exr-rs.git", branch = "main" }
exv-format = { git = "ssh://git@github.com/ssoj13/exr-rs.git", branch = "main" }
exv-codec = { git = "ssh://git@github.com/ssoj13/exr-rs.git", branch = "main" }
exv-video = { git = "ssh://git@github.com/ssoj13/exr-rs.git", branch = "main" }
flight-navigator = { git = "ssh://git@github.com/ssoj13/flight-navigator-rs.git", branch = "main" }
fnav-csg = { git = "ssh://git@github.com/ssoj13/flight-navigator-rs.git", branch = "main" }
imath-rs = { git = "ssh://git@github.com/ssoj13/exr-rs.git", branch = "main" }
vcv-rs = { version = "0.1.2", default-features = false, features = ["cuda", "optix", "nvsdk"] }
bindgen = "0.72"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
prettyplease = "0.2"
libloading = "0.8"
cuda-bindings = { git = "https://github.com/NVIDIA/cuda-rust.git", branch = "main" }
cuda-core = { git = "https://github.com/NVIDIA/cuda-rust.git", branch = "main" }
gpu-info-rs = { version = "0.1.1", default-features = false, features = ["wgpu"] }
wgpu = "30"
ash = { version = "0.38", default-features = false, features = ["std", "loaded"] }
bytemuck = { version = "1", features = ["derive"] }
half = "2"
winreg = "0.56"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
