[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Spikes are throwaway proofs with their own toolchains and lockfiles; `device` is the cuda-oxide
# device-code workspace (its own toolchain).
exclude = ["spikes", "device", "python", "demo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["NVIDIA Corporation"]
license = "Apache-2.0"
repository = "https://github.com/ssoj13/nv-rs"
keywords = ["cuda", "nvidia", "optix", "gpu", "graphics"]
categories = ["api-bindings", "hardware-support", "graphics", "science"]
publish = false

[workspace.dependencies]
nv-loader = { path = "crates/nv-loader" }
nv-bindgen = { path = "crates/nv-bindgen" }
vcv-rs = { version = "0.1.2", default-features = false, features = ["cuda", "optix", "nvsdk"] }
bindgen = "0.72"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
prettyplease = "0.2"
libloading = "0.8"
cuda-bindings = { git = "https://github.com/NVIDIA/cuda-rust.git", branch = "main" }
cuda-core = { git = "https://github.com/NVIDIA/cuda-rust.git", branch = "main" }
cuda-async = { git = "https://github.com/NVIDIA/cuda-rust.git", branch = "main" }
gpu-info-rs = { version = "0.1.0", default-features = false, features = ["wgpu"] }
wgpu = "30"
ash = { version = "0.38", default-features = false, features = ["std", "loaded"] }
bytemuck = { version = "1", features = ["derive"] }
half = "2"
winreg = "0.56"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
