[package]
name = "cuda-core-ext"
description = "CUDA driver features missing from cuda-core: external memory and semaphores, arrays, texture and surface objects, host registration, managed memory, device LUID, green contexts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/cuda_core_ext.rs"

[dependencies]
cuda-core.workspace = true
cuda-bindings.workspace = true

[lints]
workspace = true

[dev-dependencies]
gpu-info-rs = { git = "ssh://git@github.com/ssoj13/gpu-info-rs.git", branch = "main", default-features = false, features = ["wgpu"] }
wgpu = "30"
ash = { version = "0.38", default-features = false, features = ["std", "loaded"] }
