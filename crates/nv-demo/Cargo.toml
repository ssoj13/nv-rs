[package]
name = "nv-demo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nv-wgpu = { path = "../nv-wgpu" }
nv-loader = { path = "../nv-loader" }
optix = { path = "../optix" }
nvrtc = { path = "../nvrtc" }
nvml = { path = "../nvml" }
cufft = { path = "../cufft" }
nvjpeg = { path = "../nvjpeg" }
nvenc = { path = "../nvenc" }
cupti = { path = "../cupti" }
ngx = { path = "../ngx" }
cuda-core = { git = "https://github.com/NVIDIA/cuda-rust.git", branch = "main" }
cuda-bindings = { git = "https://github.com/NVIDIA/cuda-rust.git", branch = "main" }
cuda-core-ext = { path = "../cuda-core-ext" }
csg-core = { workspace = true }
csg-scene = { workspace = true }
csg-device = { workspace = true }
csg-scenes = { workspace = true }

wgpu = "30"
egui = { version = "0.36", features = ["default_fonts"] }
egui-wgpu = "0.36"
egui-winit = "0.36"
egui_dock = "0.21"
egui-phosphor = "0.14"
winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.33.2"
png = "0.18"
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
cc = "1"
csg-device = { workspace = true }

[lints]
workspace = true
