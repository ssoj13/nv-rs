[package]
name = "nv-wgpu"
description = "Zero-copy CUDA <-> wgpu 30 external memory and timeline semaphore interop (Vulkan & DX12)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "nv_wgpu"
path = "src/nv_wgpu.rs"

[lints]
workspace = true

[dependencies]
cuda-bindings.workspace = true
cuda-core.workspace = true
cuda-core-ext = { path = "../cuda-core-ext" }
gpu-info-rs.workspace = true
wgpu.workspace = true
ash.workspace = true
bytemuck.workspace = true
half.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
