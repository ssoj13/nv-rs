# cargo-deny configuration for nv-rs
[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8
# Crates in Cargo.lock whose only license is outside the allow list (read from their registry
# Cargo.toml). Scoped per crate so the global list stays permissive-only.
exceptions = [
    { crate = "clipboard-win", allow = ["BSL-1.0"] },
    { crate = "error-code", allow = ["BSL-1.0"] },
    { crate = "tiny-keccak", allow = ["CC0-1.0"] },
    { crate = "smartstring", allow = ["MPL-2.0"] },
    # egui default fonts: the code is MIT OR Apache-2.0, the bundled fonts OFL-1.1 and Ubuntu-font-1.0.
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
# Duplicate versions come from transitive dependencies and are reported, not blocking.
multiple-versions = "warn"
# Not enforced: workspace members depend on each other by path.
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
# Anything outside allow-git is an unreviewed dependency source, so it fails the check.
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Exactly the git sources in Cargo.lock for this workspace. The ssoj13 crates are declared as
# ssh:// (CI rewrites them to https for the fetch only; the lock still names the ssh URL).
# `device/` is a separate workspace with its own sources (ssoj13/cuda-rust_b) and is not checked here.
allow-git = [
    "https://github.com/NVIDIA/cuda-rust.git",
    "https://github.com/ssoj13/gpu-info-rs.git",
    "ssh://git@github.com/ssoj13/appbus-rs.git",
    "ssh://git@github.com/ssoj13/box-rs.git",
    "ssh://git@github.com/ssoj13/camera-rs.git",
    "ssh://git@github.com/ssoj13/codec-simd-rs.git",
    "ssh://git@github.com/ssoj13/crashdump-rs.git",
    "ssh://git@github.com/ssoj13/csg-rs.git",
    "ssh://git@github.com/ssoj13/exr-rs.git",
    "ssh://git@github.com/ssoj13/fsio-rs.git",
    "ssh://git@github.com/ssoj13/graph-layout-rs.git",
    "ssh://git@github.com/ssoj13/jph-rs.git",
    "ssh://git@github.com/ssoj13/murmur3.git",
    "ssh://git@github.com/ssoj13/nodes-rs.git",
    "ssh://git@github.com/ssoj13/osm-rs.git",
    "ssh://git@github.com/ssoj13/wgpu-widgets-rs.git",
]
