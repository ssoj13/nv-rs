# optix_device.h -> Rust item map for the OptiX 9.1 device API.
#
# What: every public `optix*` function of the SDK's `optix_device.h` names the Rust item(s) that
# implement it. `cargo xtask coverage optix` fails when a header function has no entry, when an entry
# names a module or item that does not exist, or when an entry is stale (not in the header).
# Value: one path or an array of paths (overloads and typed variants map to several items).
# Path: `<module>::<item>`; a trailing `::<N>` generic argument is documentation only. Modules are
# the files of `device/optix-device/src` plus two special names: `macros` is
# `device/optix-device-macros/src/optix_device_macros.rs`, `cuda_tex` is
# `device/cuda-tex-device/src/cuda_tex_device.rs`. The item must be a `pub fn`, a `macro_rules!`, a
# `pub use`, or a row of a function-generating macro table (`name -> ty = raw;` or
# `name = raw, conv -> ty;`) in that module's file.

# --- callable programs (proc macros)
optixDirectCall = "macros::direct_call"
optixContinuationCall = "macros::continuation_call"

# --- trace and shader execution reordering
