[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "nv-rs"
version = "0.1.0"
description = "Python bindings for nv-rs: zero-copy CUDA/DLPack, cuBLAS/cuFFT/cuRAND/cuSPARSE/cuTENSOR/cuDNN, NVML, NVRTC, nvCOMP, nvJPEG, nvTIFF, nvImageCodec, OptiX, NVENC/NVDEC/NVOFA, cuFile, NVTX, NVAPI, and diagnostics"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Alex Khalyavin", email = "joss13@gmail.com" }]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
dev = ["pytest>=8.0", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/ssoj13/nv-rs"
Repository = "https://github.com/ssoj13/nv-rs"
Documentation = "https://ssoj13.github.io/nv-rs/"

[tool.maturin]
python-source = "python"
module-name = "nv_rs._nv_rs"
features = ["pyo3/extension-module"]
include = ["python/nv_rs/py.typed", "python/nv_rs/__init__.pyi"]
