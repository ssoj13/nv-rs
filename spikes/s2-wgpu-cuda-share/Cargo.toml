[package]
name = "s2-wgpu-cuda-share"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Spike S2: one Vulkan allocation shared by wgpu and CUDA, ordered by a timeline semaphore"

[workspace]

[[bin]]
name = "s2-wgpu-cuda-share"
path = "src/s2_wgpu_cuda_share.rs"

[dependencies]
gpu-info-rs = { path = "../../../gpu-info-rs", default-features = false, features = ["wgpu"] }
wgpu = "30"
ash = { version = "0.38", default-features = false, features = ["std", "loaded"] }
cuda-core = { git = "ssh://git@github.com/ssoj13/cuda-rust_b.git", branch = "main" }
pollster = "0.4"
